services:
  backend_service:
    build: .
    depends_on:
      - postgres_service
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./:/app
      - media:/app/media
      - static:/app/static

  postgres_service:
    image: postgres:latest
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  celery_worker:
    build: .
    command: >
      sh -c "celery -A root worker --loglevel=info"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - backend_service
      - redis_service
      - postgres_service

  redis_service:
    image: redis:latest
    ports:
    - "6379:6379"

volumes:
  pg_data:
  media:
  static: